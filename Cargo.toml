[package]
name = "fs-dedup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["rayon", "mmap", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
dirs = "7.0.0"
dua-core = "4.1.0"
ignore = "0.4.33"
jiff = "0.2.38"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.2"
toml = "1.1.8"
walkdir = "2.5.0"
